name: Sakin Akis Guncelle

on:
  schedule:
    # Her saat basi calisir (UTC saatine gore). Sikligi degistirmek istersen
    # bu satiri duzenle, orn. her 30 dakikada bir icin "*/30 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle "Run workflow" ile de calistirilabilir
  push:
    branches: [main]      # Kod her guncellendiginde de bir kez calissin

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sakin Akis'i calistir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sakin_akis.py

      - name: Pages icin hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
