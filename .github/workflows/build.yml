name: Sakin Akis Guncelle

on:
  schedule:
    # Her 6 saatte bir calisir (UTC saatine gore) -- eskiden saatlik calisiyordu
    # ama AI kumeleme dogrulamasi (Claude Haiku) her calistiginda API'ya
    # ucret odeniyor, RSS pencereleri (when:3d vb.) buyuk olcude ortustugu
    # icin saatlik calistirmak ayni adaylari surekli tekrar tekrar
    # faturalandiriyordu (~$35/ay). 6 saatte bir ile ~$0.20/gun, $5 kredi
    # ~1 ay yetiyor. Sikligi degistirmek istersen bu satiri duzenle.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle "Run workflow" ile de calistirilabilir
  push:
    branches: [main]      # Kod her guncellendiginde de bir kez calissin

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kumeleme onbellegini geri yukle
        # AI kumeleme dogrulamasi (Claude Haiku) pahali islem; RSS pencereleri
        # build'ler arasi buyuk olcude ortustugu icin ayni aday kume art arda
        # birkac build'de de tekrar ortaya cikiyor. Bu cache dogrulanmis
        # kararlari build'ler arasi tasiyip aynı gruba tekrar AI cagrisi
        # yapilmasini onluyor (cluster_cache.json, bkz. sakin_akis.py).
        # key her run'da benzersiz (run_id) oldugu icin is bitiminde kayit
        # HER ZAMAN basariyla kaydediliyor; restore-keys onekiyle en son
        # kaydedilen onceki cache geri yukleniyor.
        uses: actions/cache@v4
        with:
          path: cluster_cache.json
          key: cluster-cache-${{ github.run_id }}
          restore-keys: |
            cluster-cache-

      - name: Sakin Akis'i calistir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sakin_akis.py

      - name: Pages icin hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
